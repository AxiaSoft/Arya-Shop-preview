<!doctype html>
<html lang="fa" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت آریا</title>

  <!-- استایل بحرانی: بلافاصله پس‌زمینه تیره را نمایش می‌دهد تا صفحه قبلی
       (سایت اصلی) در حین بارگذاری اسکریپت‌های سنگین به چشم نیاید (رفع مشکل
       «فلش زدن سایت اصلی» هنگام ورود به پنل مدیریت) -->
  <style>
    html, body { background: #142346; }
    #admin-auth-screen, #admin-panel-screen { display: none; }
  </style>

  <!-- SDKها با try/catch مدیریت می‌شوند -->
  <script>
    // stub SDKها تا خطا نده
    try { if(!window.dataSdk) window.dataSdk = null; } catch(e) {}
    try { if(!window.elementSdk) window.elementSdk = null; } catch(e) {}
  </script>

  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Vazirmatn', system-ui, sans-serif; }
    /* Auth form styles */
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .input-auth {
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.12);
      padding: 14px 16px;
      border-radius: 12px;
      color: white;
      width: 100%;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
      font-size: 0.95rem;
    }
    .input-auth::placeholder { color: rgba(255,255,255,0.35); }
    .input-auth:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,0.2); }
    .btn-auth {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white; font-weight: 700; padding: 14px;
      border-radius: 12px; width: 100%; font-size: 1rem;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(99,102,241,0.4);
      font-family: inherit; cursor: pointer;
    }
    .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(99,102,241,0.5); }
    .tab-auth { padding: 10px 20px; border-radius: 10px; font-size: 0.9rem; font-weight: 600;
      transition: all 0.2s; font-family: inherit; cursor: pointer; flex: 1; }
    .tab-active { background: rgba(139,92,246,0.2); border: 1.5px solid rgba(139,92,246,0.5); color: #c4b5fd; }
    .tab-inactive { background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
    .tab-inactive:hover { background: rgba(255,255,255,0.08); }
    .sbar { height: 4px; border-radius: 4px; flex: 1; transition: all 0.3s; }
    #admin-auth-screen { display: none; }
    #admin-panel-screen { display: none; }
  </style>
  <!-- توجه: مکانیزم قبلی محافظت از رندر زودهنگام (captureRealRender) حذف شد
       چون window._originalRender را با null جایگزین می‌کرد و باعث می‌شد
       تابع render() برای همیشه هیچ کاری انجام ندهد. رندرهای زودهنگام و
       نامرئی (روی #app که داخل بخش مخفی admin-panel-screen است) کاملاً
       بی‌خطر هستند، پس نیازی به این محافظت نیست. -->

</head>
<body class="bg-main text-white overflow-auto">

  <!-- AUTH SCREEN -->
  <div id="admin-auth-screen" class="auth-wrap">
    <div style="width:100%;max-width:420px">
      <div id="admin-auth-app"></div>
    </div>
  </div>

  <!-- PANEL SCREEN (full admin panel rendered here) -->
  <div id="admin-panel-screen" class="min-h-screen w-full">
    <div id="app" class="min-h-screen w-full"></div>
    <div id="toast-container" class="fixed top-4 left-4 right-4 md:left-auto md:right-6 md:w-96 z-[200] flex flex-col gap-3 pointer-events-none"></div>
  </div>

  <script>
  // ══════════════════════════════════════════════════════════
  // ADMIN AUTH — مبتنی بر Db.php (بدون ثبت‌نام عمومی)
  // فقط حساب‌هایی که از قبل در دیتابیس (به‌صورت دستی) تعریف شده‌اند
  // اجازه ورود دارند. ورود ۳ مرحله‌ای: رمز عبور → کد ۶ رقمی → رمز
  // دومرحله‌ای (در صورت فعال بودن برای آن حساب)
  // ══════════════════════════════════════════════════════════

  const ADMIN_API = 'Db.php';

  window.ARYA_CSRF = window.ARYA_CSRF || null; // توکن CSRF مشترک admin.html ↔ adminP.js

  async function adminApiRaw(action, body) {
    const headers = body ? { 'Content-Type': 'application/json' } : {};
    if (body && window.ARYA_CSRF) headers['X-CSRF-Token'] = ARYA_CSRF;
    const res = await fetch(ADMIN_API + '?action=' + action, {
      method: body ? 'POST' : 'GET',
      credentials: 'same-origin',
      headers,
      body: body ? JSON.stringify(body) : undefined
    });
    let json;
    try { json = await res.json(); }
    catch (e) { json = { ok: false, msg: 'پاسخ نامعتبر از سرور دریافت شد.' }; }
    json._status = res.status;
    if (json.ok && json.data && json.data.csrf) window.ARYA_CSRF = json.data.csrf; // capture
    return json;
  }

  async function adminApi(action, body) {
    let json = await adminApiRaw(action, body);
    if (!json.ok && json._status === 403 && /CSRF/.test(String(json.msg || ''))) {
      try {
        const c = await fetch(ADMIN_API + '?action=csrf', { credentials: 'same-origin' }).then(r => r.json());
        if (c && c.ok && c.data && c.data.csrf) { window.ARYA_CSRF = c.data.csrf; json = await adminApiRaw(action, body); }
      } catch (e) {}
    }
    return json;
  }
  window.aryaAdminCall = function (action, body) { return adminApi(action, body); };

  // تغییر اجباری رمز پیش‌فرض پس از نصب — پیش از ورود کامل پنل
  window.handleAdminMustChange = async function (e) {
    e.preventDefault();
    const f = e.target;
    const cur = f.cur.value || '', n1 = f.n1.value || '', n2 = f.n2.value || '';
    if (n1.length < 8) { AUTH.error = 'رمز جدید باید حداقل ۸ کاراکتر باشد.'; authRender(); return; }
    if (n1 !== n2)     { AUTH.error = 'رمزهای جدید یکسان نیستند.'; authRender(); return; }
    AUTH.loading = true; AUTH.error = ''; authRender();
    const json = await adminApi('admin_change_password', { current_password: cur, new_password: n1 });
    AUTH.loading = false;
    if (!json.ok) { AUTH.error = json.msg || 'تغییر رمز ناموفق بود.'; authRender(); return; }
    showToastAuth('✅ رمز عبور تغییر کرد', 'success');
    startAdminPanel(AUTH.admin || {});
  };

  // ── Auth state ──
  var AUTH = {
    step: 'login',   // login | otp | twofactor | db_not_ready | server_unreachable
    error: '',
    otpDemo: '',
    otpTarget: '',
    loading: false
  };

  function authRender() {
    const el = document.getElementById('admin-auth-app');
    if (!el) return;
    el.innerHTML = buildAuthHTML();
  }

  function showToastAuth(msg, type) {
    const colors = { success:'#10b981', error:'#ef4444', warning:'#f59e0b', info:'#6366f1' };
    const div = document.createElement('div');
    div.style.cssText = `position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;
      background:${colors[type]||colors.info};color:white;padding:12px 24px;border-radius:12px;
      font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,0.4);font-family:Vazirmatn,sans-serif;`;
    div.textContent = msg;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 3000);
  }

  function toggleVis(id, btn) {
    const el = document.getElementById(id);
    if (!el) return;
    el.type = el.type === 'password' ? 'text' : 'password';
    btn.textContent = el.type === 'password' ? '👁' : '🙈';
    el.focus();
  }

  // تبدیل ارقام فارسی/عربی به انگلیسی (چون بعضی کیبوردهای فارسی حتی در
  // فیلدهای عددی، رقم فارسی/عربی تایپ می‌کنند و باعث خطای «فیلد خالی» می‌شدند)
  function normalizeDigits(str) {
    if (!str) return '';
    const persian = '۰۱۲۳۴۵۶۷۸۹';
    const arabic  = '٠١٢٣٤٥٦٧٨٩';
    return String(str).replace(/[۰-۹٠-٩]/g, ch => {
      const pIdx = persian.indexOf(ch);
      if (pIdx > -1) return String(pIdx);
      const aIdx = arabic.indexOf(ch);
      if (aIdx > -1) return String(aIdx);
      return ch;
    }).trim();
  }

  function buildAuthHTML() {
    const err = AUTH.error;

    const titleMap = {
      login: 'ورود به پنل مدیریت',
      mustchange: 'تغییر رمز عبور (اجباری)',
      otp: 'تایید هویت',
      twofactor: 'تایید دومرحله‌ای',
      db_not_ready: 'پنل مدیریت',
      server_unreachable: 'پنل مدیریت'
    };

    const header = `
      <div style="text-align:center;margin-bottom:2rem">
        <div style="width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,#6366f1,#8b5cf6);
          display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin:0 auto 1rem;
          box-shadow:0 20px 40px rgba(99,102,241,0.4)">⚙️</div>
        <h1 style="font-size:1.5rem;font-weight:900;margin-bottom:.25rem">${titleMap[AUTH.step] || 'پنل مدیریت'}</h1>
        <p style="color:rgba(255,255,255,0.5);font-size:.85rem">دسترسی اختصاصی مدیران — فقط حساب‌های از پیش تعریف‌شده</p>
      </div>`;

    let form = '';

    if (AUTH.step === 'server_unreachable') {
      form = `
        <div style="text-align:center;color:rgba(255,255,255,.7);font-size:.9rem;line-height:2">
          امکان ارتباط با سرور برقرار نشد.<br>
          لطفاً از اجرای سایت روی یک سرور PHP مطمئن شوید و دوباره تلاش کنید.
        </div>
        <button type="button" onclick="startupCheckAdminSession()" class="btn-auth" style="margin-top:1.5rem">تلاش مجدد</button>
      `;
    }

    else if (AUTH.step === 'db_not_ready') {
      form = `
        <div style="text-align:center;color:rgba(255,255,255,.7);font-size:.9rem;line-height:2">
          دیتابیس سایت هنوز راه‌اندازی نشده است.<br>
          ابتدا از صفحه اصلی سایت، دیتابیس را متصل کنید.
        </div>
        <a href="index.html" target="_blank" style="display:block;text-align:center;margin-top:1.5rem;text-decoration:none" class="btn-auth">رفتن به صفحه راه‌اندازی</a>
        <button type="button" onclick="startupCheckAdminSession()"
          style="width:100%;margin-top:.75rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.7);
            padding:.75rem;border-radius:12px;cursor:pointer;font-family:inherit;font-size:.85rem">
          بررسی مجدد وضعیت
        </button>
      `;
    }

    else if (AUTH.step === 'login') {
      form = `
        <form onsubmit="handleAdminLoginStep1(event)" style="display:flex;flex-direction:column;gap:1rem" autocomplete="off">
          <div>
            <label style="display:block;font-size:.85rem;color:rgba(255,255,255,.7);margin-bottom:.5rem">ایمیل یا شماره موبایل</label>
            <input name="identifier" id="auth-id" class="input-auth" dir="ltr" required
              placeholder="admin@example.com یا 09..." autocomplete="off" readonly onfocus="this.removeAttribute('readonly')">
          </div>
          <div>
            <label style="display:block;font-size:.85rem;color:rgba(255,255,255,.7);margin-bottom:.5rem">رمز عبور</label>
            <div style="position:relative">
              <input name="password" id="auth-pass" type="password" class="input-auth"
                style="padding-left:3rem" placeholder="رمز عبور" required autocomplete="off" readonly onfocus="this.removeAttribute('readonly')">
              <button type="button" onclick="toggleVis('auth-pass',this)"
                style="position:absolute;left:.75rem;top:50%;transform:translateY(-50%);
                  color:rgba(255,255,255,.4);background:none;border:none;cursor:pointer;font-size:1.2rem">👁</button>
            </div>
          </div>
          ${err?`<div style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:.75rem 1rem;color:#fca5a5;font-size:.85rem">${err}</div>`:''}
          <button type="submit" class="btn-auth" style="margin-top:.5rem" ${AUTH.loading?'disabled':''}>${AUTH.loading?'در حال بررسی...':'ورود'}</button>
        </form>
        <p style="text-align:center;color:rgba(255,255,255,.35);font-size:.72rem;margin-top:1.25rem">
          حساب‌های مدیر فقط به‌صورت دستی (از داخل پنل توسط مدیر دیگر یا phpMyAdmin) ایجاد می‌شوند؛
          امکان ثبت‌نام عمومی وجود ندارد.
        </p>
      `;
    }

    else if (AUTH.step === 'otp') {
      form = `
        <div style="text-align:center;margin-bottom:1rem;color:rgba(255,255,255,.6);font-size:.85rem">
          کد ۶ رقمی ارسال‌شده به <b style="color:#c4b5fd">${AUTH.otpTarget}</b> را وارد کنید
        </div>
        ${AUTH.otpDemo ? `
          <div style="background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.3);border-radius:10px;padding:.6rem 1rem;color:#c4b5fd;font-size:.78rem;margin-bottom:1rem;text-align:center">
            🧪 حالت آزمایشی — کد تایید: <b style="letter-spacing:2px">${AUTH.otpDemo}</b><br>
            <span style="font-size:.7rem;opacity:.8">(پیش از انتشار واقعی، باید به سرویس پیامک/ایمیل واقعی وصل شود)</span>
          </div>
        ` : ''}
        <form onsubmit="handleAdminLoginStep2(event)" style="display:flex;flex-direction:column;gap:1rem">
          <input name="otp" inputmode="numeric" maxlength="6" required autofocus
            class="input-auth" dir="ltr" style="text-align:center;letter-spacing:.5em;font-size:1.3rem;font-weight:700"
            placeholder="------">
          ${err?`<div style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:.75rem 1rem;color:#fca5a5;font-size:.85rem">${err}</div>`:''}
          <button type="submit" class="btn-auth" ${AUTH.loading?'disabled':''}>${AUTH.loading?'در حال بررسی...':'تایید کد'}</button>
          <button type="button" onclick="cancelAdminLoginFlow()"
            style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.7);
              padding:.75rem;border-radius:12px;cursor:pointer;font-family:inherit;font-size:.9rem">
            ← بازگشت
          </button>
        </form>
      `;
    }

    else if (AUTH.step === 'twofactor') {
      form = `
        <div style="text-align:center;margin-bottom:1rem;color:rgba(255,255,255,.6);font-size:.85rem">
          این حساب رمز دومرحله‌ای فعال دارد؛ آن را وارد کنید
        </div>
        <form onsubmit="handleAdminLoginStep3(event)" style="display:flex;flex-direction:column;gap:1rem">
          <div style="position:relative">
            <input name="two_factor_password" id="auth-2fa-pass" type="password" class="input-auth" autocomplete="off"
              style="padding-left:3rem" placeholder="رمز دومرحله‌ای" required autofocus>
            <button type="button" onclick="toggleVis('auth-2fa-pass',this)"
              style="position:absolute;left:.75rem;top:50%;transform:translateY(-50%);
                color:rgba(255,255,255,.4);background:none;border:none;cursor:pointer;font-size:1.2rem">👁</button>
          </div>
          ${err?`<div style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:.75rem 1rem;color:#fca5a5;font-size:.85rem">${err}</div>`:''}
          <button type="submit" class="btn-auth" ${AUTH.loading?'disabled':''}>${AUTH.loading?'در حال بررسی...':'ورود نهایی'}</button>
          <button type="button" onclick="cancelAdminLoginFlow()"
            style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.7);
              padding:.75rem;border-radius:12px;cursor:pointer;font-family:inherit;font-size:.9rem">
            ← بازگشت
          </button>
        </form>
      `;
    }

    else if (AUTH.step === 'mustchange') {
      form = `
        <div style="text-align:center;margin-bottom:1rem;color:rgba(255,255,255,.6);font-size:.85rem;line-height:2">
          🔐 برای ادامه، رمز عبور اولیه خود را تغییر دهید.
        </div>
        <form onsubmit="handleAdminMustChange(event)" style="display:flex;flex-direction:column;gap:1rem" autocomplete="off">
          <input name="cur" type="password" class="input-auth" placeholder="رمز فعلی" required autofocus autocomplete="current-password">
          <input name="n1" type="password" class="input-auth" placeholder="رمز جدید (حداقل ۸ کاراکتر، حرف بزرگ و رقم)" required autocomplete="new-password">
          <input name="n2" type="password" class="input-auth" placeholder="تکرار رمز جدید" required autocomplete="new-password">
          ${err?`<div style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:.75rem 1rem;color:#fca5a5;font-size:.85rem">${err}</div>`:''}
          <button type="submit" class="btn-auth" ${AUTH.loading?'disabled':''}>${AUTH.loading?'در حال ذخیره...':'ذخیره رمز جدید و ورود'}</button>
          <button type="button" onclick="cancelAdminLoginFlow()"
            style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.7);
              padding:.75rem;border-radius:12px;cursor:pointer;font-family:inherit;font-size:.9rem">
            ← بازگشت به ورود
          </button>
        </form>
      `;
    }

    return `
      <div style="animation:fadeIn .4s ease">
        ${header}
        <div style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:1.75rem">
          ${form}
        </div>
        ${AUTH.step === 'login' ? `
        <p style="text-align:center;color:rgba(255,255,255,.25);font-size:.75rem;margin-top:1.5rem">
          دسترسی فقط برای مدیران مجاز سیستم
        </p>` : ''}
      </div>`;
  }

  function isDbNotReadyResponse(json) {
    return json && json._status === 503;
  }

  // ── Handlers ──
  async function handleAdminLoginStep1(e) {
    e.preventDefault();
    const identifier = e.target.identifier.value.trim();
    const password = e.target.password.value;

    AUTH.loading = true; AUTH.error = ''; authRender();

    try {
      const json = await adminApi('admin_login_step1', { identifier, password });
      AUTH.loading = false;

      if (isDbNotReadyResponse(json)) { AUTH.step = 'db_not_ready'; authRender(); return; }

      if (!json.ok) {
        AUTH.error = json.msg || 'ورود ناموفق بود.';
        authRender();
        return;
      }

      AUTH.step = 'otp';
      AUTH.error = '';
      AUTH.otpTarget = json.data.target_masked || '';
      AUTH.otpDemo = json.data.otp_demo || '';
      authRender();
    } catch (err) {
      AUTH.loading = false;
      AUTH.error = 'ارتباط با سرور برقرار نشد.';
      authRender();
    }
  }

  async function handleAdminLoginStep2(e) {
    e.preventDefault();
    const otp = normalizeDigits(e.target.otp.value);

    if (!/^\d{6}$/.test(otp)) {
      AUTH.error = 'کد تایید باید دقیقاً ۶ رقم باشد.';
      authRender();
      return;
    }

    AUTH.loading = true; AUTH.error = ''; authRender();

    try {
      const json = await adminApi('admin_login_step2', { otp });
      AUTH.loading = false;

      if (!json.ok) {
        AUTH.error = json.msg || 'کد تایید اشتباه است.';
        authRender();
        return;
      }

      if (json.data.two_factor_required) {
        AUTH.step = 'twofactor';
        AUTH.error = '';
        authRender();
        return;
      }
      if (json.data && json.data.must_change_password) {
        AUTH.admin = json.data.admin || {};
        AUTH.step = 'mustchange'; AUTH.error = '';
        authRender(); return;
      }

      showToastAuth('✅ ورود موفق! در حال بارگذاری پنل...', 'success');
      setTimeout(() => startAdminPanel(json.data.admin), 400);
    } catch (err) {
      AUTH.loading = false;
      AUTH.error = 'ارتباط با سرور برقرار نشد.';
      authRender();
    }
  }

  async function handleAdminLoginStep3(e) {
    e.preventDefault();
    const two_factor_password = e.target.two_factor_password.value;

    AUTH.loading = true; AUTH.error = ''; authRender();

    try {
      const json = await adminApi('admin_login_step3', { two_factor_password });
      AUTH.loading = false;

      if (!json.ok) {
        AUTH.error = json.msg || 'رمز دومرحله‌ای اشتباه است.';
        authRender();
        return;
      }

      showToastAuth('✅ ورود موفق! در حال بارگذاری پنل...', 'success');
      setTimeout(() => startAdminPanel(json.data.admin), 400);
    } catch (err) {
      AUTH.loading = false;
      AUTH.error = 'ارتباط با سرور برقرار نشد.';
      authRender();
    }
  }

  function cancelAdminLoginFlow() {
    AUTH.step = 'login';
    AUTH.error = '';
    AUTH.otpDemo = '';
    AUTH.otpTarget = '';
    authRender();
    adminApi('admin_logout').catch(() => {}); // لغو best-effort مرحله نیمه‌کاره در سرور
  }

  // ── Start admin panel (after successful login) ──
  function startAdminPanel(adminInfo) {
    document.getElementById('admin-auth-screen').style.display = 'none';
    document.getElementById('admin-panel-screen').style.display = 'block';

    function applyAdminState() {
      try {
        if (typeof state !== 'undefined') {
          state.isAdmin    = true;
          state.page       = 'admin';
          state.adminTab   = state.adminTab || 'dashboard';
          state.user       = { phone: adminInfo.phone, name: adminInfo.name, email: adminInfo.email, role: adminInfo.role };
          state.currentUser = state.user;
        }
      } catch(e) { console.warn('[Admin] applyAdminState:', e); }
    }

    function waitAndRender(tries) {
      if (tries <= 0) {
        console.error('[Admin] Timeout: renderAdminPanel not defined');
        const appEl = document.getElementById('app');
        if (appEl) {
          appEl.innerHTML = '<div class="p-10 text-center text-white">خطا در بارگذاری پنل مدیریت. لطفاً صفحه را رفرش کنید.</div>';
        }
        return;
      }
      if (typeof renderAdminPanel === 'function' && typeof render === 'function') {
        applyAdminState();
        const doRender = () => render();
        if (window.AryaDB) {
          AryaDB.init().then(() => AryaDB.loadToState()).then(doRender).catch(doRender);
        } else {
          doRender();
        }
      } else {
        setTimeout(() => waitAndRender(tries - 1), 100);
      }
    }

    waitAndRender(40); // up to 4 seconds

    window.adminLogout = function() {
      adminApi('admin_logout').catch(() => {});
      if (typeof state !== 'undefined') {
        state.isAdmin = false;
        state.user = null;
        state.page = 'home';
        state.adminTab = 'dashboard';
      }
      document.getElementById('admin-panel-screen').style.display = 'none';
      document.getElementById('admin-auth-screen').style.display = 'flex';
      AUTH.step = 'login'; AUTH.error = ''; authRender();
      showToastAuth('از پنل خارج شدید', 'info');
    };
  }

  // ══════════════════════════════════════════════════════════
  // STARTUP — بررسی سشن فعال روی سرور (نه localStorage)
  // ══════════════════════════════════════════════════════════
  async function startupCheckAdminSession() {
    document.getElementById('admin-auth-screen').style.display = 'flex';
    document.getElementById('admin-panel-screen').style.display = 'none';
    AUTH.step = 'login';
    AUTH.error = '';
    authRender();

    try {
      const json = await adminApi('admin_session');

      if (isDbNotReadyResponse(json)) { AUTH.step = 'db_not_ready'; authRender(); return; }

      if (json.ok && json.data && json.data.loggedIn) {
        if (json.data.must_change_password) {
          AUTH.admin = json.data.admin || {};
          AUTH.step = 'mustchange'; AUTH.error = '';
          authRender(); return;
        }
        startAdminPanel(json.data.admin);
        return;
      }
      // لاگین نبود — صفحه ورود که بالا نمایش داده شد باقی می‌ماند
    } catch (err) {
      AUTH.step = 'server_unreachable';
      authRender();
    }
  }

  window.addEventListener('load', startupCheckAdminSession);
  </script>
